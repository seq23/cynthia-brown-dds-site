name: Scheduled Content Refresh Legacy Alias
on:
  workflow_dispatch:
jobs:
  future-drafts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/generate_auto_draft.js
        env:
          ENABLE_AUTO_DRAFTS: ${{ vars.ENABLE_AUTO_DRAFTS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - run: npm run build
      - run: npm run validate:all
      - name: Push automation branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/future-dental-drafts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No future draft changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh future dental drafts"
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin HEAD:"$BRANCH"
