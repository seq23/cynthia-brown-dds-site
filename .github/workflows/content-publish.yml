name: Content Publish
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'
jobs:
  publish-approved-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/publish_approved_content.js
      - name: Push automation branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/publish-approved-resources"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No approved content changes to publish."
            exit 0
          fi
          git commit -m "chore: publish approved dental resources"
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin HEAD:"$BRANCH"
