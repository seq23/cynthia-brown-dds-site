name: Content Publish
on:
  workflow_dispatch:
  schedule:
    - cron: '10 4 * * 4'  # America/Chicago, all year
      timezone: America/Chicago
jobs:
  publish-approved-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/publish_approved_content.js
      - name: Commit released resources to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data/admin
          if git diff --cached --quiet; then
            echo "No resources came due this week."
            exit 0
          fi
          git commit -m "chore: release scheduled dental resources"
          for i in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; done
          echo "NAMED STOP [PUSH_FAILED] could not push released resources to main" >&2; exit 1
