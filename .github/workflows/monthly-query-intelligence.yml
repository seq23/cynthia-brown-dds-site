name: Monthly Query Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 1 * *'
jobs:
  query-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/ingest_query_signals.js
      - run: node scripts/normalize_query_signals.js
      - run: node scripts/cluster_query_signals.js
      - run: node scripts/score_content_gaps.js
      - run: node scripts/generate_content_briefs.js
      - run: npm run build
      - run: npm run validate:all
      - name: Push automation branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/dental-query-intelligence"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No query intelligence changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh dental query intelligence"
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin HEAD:"$BRANCH"
