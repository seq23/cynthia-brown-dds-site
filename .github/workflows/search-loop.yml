name: Search Loop

# The shared search growth engine (seq23/search-loop @v1). Owner ruling 1 Nov 2026:
# no approval step; gated patient-question pages publish straight away under
# /questions/, each ending in the one action (book a visit). The engine's dental
# gate applies, and the post-build step re-runs this repo's validators
# (scripts/validate_all.js, incl. the dental-claims check) before anything is pushed:
# a failing page blocks the commit and the next run retries.
# Reports stay in this repo (Actions artifact "search-loop-week"); nothing goes to Boss OS.
on:
  schedule:
    - cron: '17 6 * * *'  # America/Chicago, all year
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: main-automation
  cancel-in-progress: false

jobs:
  search-loop:
    uses: seq23/search-loop/.github/workflows/search-loop.yml@v1
    with:
      engine_ref: v1
      stage: ${{ inputs.stage || 'auto' }}
      post_build_command: bash .github/scripts/search_loop_post_build.sh
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      # $0 model lanes (engine v1.2.3): Gemini free tier (no-billing project), metered Workers AI
      # (usage read with the analytics token, model run with the Workers AI token; 600 neurons/day).
      CLOUDFLARE_API_TOKEN: ${{ secrets.SEARCH_LOOP_CF_USAGE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SEARCH_LOOP_CF_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.SEARCH_LOOP_CF_WORKERS_AI_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.SEARCH_LOOP_GEMINI_API_KEY }}
